name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# 这个仓库的测试是零网络、零 key 的，所以 CI 不需要任何 secret。
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: node ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ["20", "22"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: 安装依赖（只有 ajv + sharp）
        run: npm ci

      - name: 单元 / 契约 / 集成测试
        run: npm test

      - name: 七道机械门
        # 与 test 分开：test 不包含它，改完 core/ 或 data/specs/ 必须单独跑
        run: npm run check:decouple

      - name: 产出正确性评测
        run: npm run evals

      - name: 端到端冒烟（零 key 全链路）
        run: npm run quickstart
