<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 680 366" width="100%" role="img" xmlns="http://www.w3.org/2000/svg">
<title>可回放的一键全链路</title>
<desc>输入经四段处理产出交付包，每段都留下可核对的产物，下方是统一的证据层。</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
</defs>
<rect x="40" y="40" width="600" height="50" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text x="340" y="58" text-anchor="middle" dominant-baseline="central" font-family="system-ui,sans-serif" font-size="13" font-weight="500" fill="#2C2C2A">输入：品类 / 法域 / 选品工单</text>
<text x="340" y="76" text-anchor="middle" dominant-baseline="central" font-family="system-ui,sans-serif" font-size="11" fill="#5F5E5A">法域是配置不是代码，加市场只改 regions/</text>
<path d="M340 90 L340 106" fill="none" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="40" y="108" width="141" height="58" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<rect x="193" y="108" width="141" height="58" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<rect x="346" y="108" width="141" height="58" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<rect x="499" y="108" width="141" height="58" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text x="110" y="127" text-anchor="middle" dominant-baseline="central" font-family="system-ui,sans-serif" font-size="13" font-weight="500" fill="#2C2C2A">采集</text>
<text x="110" y="147" text-anchor="middle" dominant-baseline="central" font-family="system-ui,sans-serif" font-size="11" fill="#5F5E5A">工单 + 事实四元组</text>
<text x="263" y="127" text-anchor="middle" dominant-baseline="central" font-family="system-ui,sans-serif" font-size="13" font-weight="500" fill="#04342C">判别（10 个点）</text>
<text x="263" y="147" text-anchor="middle" dominant-baseline="central" font-family="system-ui,sans-serif" font-size="11" fill="#0F6E56">台账 + 决策 + 封顶</text>
<text x="416" y="127" text-anchor="middle" dominant-baseline="central" font-family="system-ui,sans-serif" font-size="13" font-weight="500" fill="#2C2C2A">生产</text>
<text x="416" y="147" text-anchor="middle" dominant-baseline="central" font-family="system-ui,sans-serif" font-size="11" fill="#5F5E5A">9 张 900×1200 + 渲染</text>
<text x="569" y="127" text-anchor="middle" dominant-baseline="central" font-family="system-ui,sans-serif" font-size="13" font-weight="500" fill="#2C2C2A">上品信息</text>
<text x="569" y="147" text-anchor="middle" dominant-baseline="central" font-family="system-ui,sans-serif" font-size="11" fill="#5F5E5A">input.json + 平台投影</text>
<path d="M181 137 L191 137" fill="none" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
<path d="M334 137 L344 137" fill="none" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
<path d="M487 137 L497 137" fill="none" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
<path d="M340 166 L340 182" fill="none" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="40" y="184" width="600" height="94" rx="12" fill="#F1EFE8" stroke="#888780" stroke-width="0.5"/>
<text x="56" y="202" dominant-baseline="central" font-family="system-ui,sans-serif" font-size="11" font-weight="500" fill="#444441">证据层：每段产物由代码生成，可逐条回放</text>
<rect x="56" y="216" width="133" height="46" rx="8" fill="#FFFFFF" stroke="#B4B2A9" stroke-width="0.5"/>
<rect x="199" y="216" width="133" height="46" rx="8" fill="#FFFFFF" stroke="#B4B2A9" stroke-width="0.5"/>
<rect x="342" y="216" width="133" height="46" rx="8" fill="#FFFFFF" stroke="#B4B2A9" stroke-width="0.5"/>
<rect x="485" y="216" width="139" height="46" rx="8" fill="#FFFFFF" stroke="#B4B2A9" stroke-width="0.5"/>
<text x="122" y="232" text-anchor="middle" dominant-baseline="central" font-family="system-ui,sans-serif" font-size="11" font-weight="500" fill="#2C2C2A">判别台账</text>
<text x="122" y="249" text-anchor="middle" dominant-baseline="central" font-family="system-ui,sans-serif" font-size="11" fill="#5F5E5A">prompt 哈希 + 原文</text>
<text x="265" y="232" text-anchor="middle" dominant-baseline="central" font-family="system-ui,sans-serif" font-size="11" font-weight="500" fill="#2C2C2A">回执与等级</text>
<text x="265" y="249" text-anchor="middle" dominant-baseline="central" font-family="system-ui,sans-serif" font-size="11" fill="#5F5E5A">从台账反算 L1/L2</text>
<text x="408" y="232" text-anchor="middle" dominant-baseline="central" font-family="system-ui,sans-serif" font-size="11" font-weight="500" fill="#2C2C2A">降级与成本</text>
<text x="408" y="249" text-anchor="middle" dominant-baseline="central" font-family="system-ui,sans-serif" font-size="11" fill="#5F5E5A">缺什么写清，不编金额</text>
<text x="554" y="232" text-anchor="middle" dominant-baseline="central" font-family="system-ui,sans-serif" font-size="11" font-weight="500" fill="#2C2C2A">门禁与自评</text>
<text x="554" y="249" text-anchor="middle" dominant-baseline="central" font-family="system-ui,sans-serif" font-size="11" fill="#5F5E5A">7 门 + 242 项测试</text>
<path d="M340 278 L340 294" fill="none" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="40" y="296" width="600" height="50" rx="8" fill="#FFFFFF" stroke="#0F6E56" stroke-width="0.5"/>
<text x="340" y="313" text-anchor="middle" dominant-baseline="central" font-family="system-ui,sans-serif" font-size="13" font-weight="500" fill="#04342C">LLM 在解释位与权衡位，执行位是代码</text>
<text x="340" y="331" text-anchor="middle" dominant-baseline="central" font-family="system-ui,sans-serif" font-size="11" fill="#0F6E56">封顶、配额、脱敏、权限矩阵都由确定性代码执行</text>
</svg>
